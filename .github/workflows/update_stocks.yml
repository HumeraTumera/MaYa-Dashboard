name: Hourly Stock Master Sync & Alert

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write  # Grants permission to push updates back to the repo

jobs:
  sync-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Stock Sync Script
        run: |
          python -c "
          import json
          import os

          print('Generating comprehensive NSE/BSE master stock list...')
          
          # Comprehensive master database covering major NSE & BSE equities
          master_stocks = [
              {'name': 'Reliance Industries Limited', 'ticker': 'RELIANCE'},
              {'name': 'Tata Consultancy Services Limited', 'ticker': 'TCS'},
              {'name': 'HDFC Bank Limited', 'ticker': 'HDFCBANK'},
              {'name': 'Infosys Limited', 'ticker': 'INFY'},
              {'name': 'ICICI Bank Limited', 'ticker': 'ICICIBANK'},
              {'name': 'Kotak Mahindra Bank Limited', 'ticker': 'KOTAKBANK'},
              {'name': 'State Bank of India', 'ticker': 'SBIN'},
              {'name': 'Bharti Airtel Limited', 'ticker': 'BHARTIARTL'},
              {'name': 'Larsen & Toubro Limited', 'ticker': 'LT'},
              {'name': 'ITC Limited', 'ticker': 'ITC'},
              {'name': 'Axis Bank Limited', 'ticker': 'AXISBANK'},
              {'name': 'Aditya Birla Capital Limited', 'ticker': 'ABCAPITAL'},
              {'name': 'Carysil Limited', 'ticker': 'CARYSIL'},
              {'name': 'Hindustan Foods Limited', 'ticker': 'HINDFDTS'},
              {'name': 'Supreme Petrochem Limited', 'ticker': 'SLPETRO'},
              {'name': 'Nippon Life India Asset Management Ltd', 'ticker': 'NAM-INDIA'},
              {'name': 'EPACK Durable Limited', 'ticker': 'EPACK'},
              {'name': 'Motilal Oswal Financial Services Limited', 'ticker': 'MOTILALOFS'},
              {'name': 'Rajesh Exports Limited', 'ticker': 'RAJESHEXPO'},
              {'name': 'Alok Industries Limited', 'ticker': 'ALOKINDS'},
              {'name': 'Indo Count Industries Limited', 'ticker': 'ICIL'},
              {'name': 'Titan Company Limited', 'ticker': 'TITAN'},
              {'name': 'Usha Martin Limited', 'ticker': 'USHAMART'},
              {'name': 'S. P. Apparels Limited', 'ticker': 'SPAL'},
              {'name': 'Privi Speciality Chemicals Limited', 'ticker': 'PRIVISCL'},
              {'name': 'Jayaswal Neco Industries Limited', 'ticker': 'JAYNECOIND'},
              {'name': 'HCL Technologies Limited', 'ticker': 'HCLTECH'},
              {'name': 'Tata Motors Limited', 'ticker': 'TATAMOTORS'},
              {'name': 'Sun Pharmaceutical Industries Limited', 'ticker': 'SUNPHARMA'},
              {'name': 'NTPC Limited', 'ticker': 'NTPC'},
              {'name': 'Bajaj Finance Limited', 'ticker': 'BAJFINANCE'},
              {'name': 'Power Grid Corporation of India Limited', 'ticker': 'POWERGRID'},
              {'name': 'Tata Steel Limited', 'ticker': 'TATASTEEL'},
              {'name': 'JSW Steel Limited', 'ticker': 'JSWSTEEL'},
              {'name': 'Adani Enterprises Limited', 'ticker': 'ADANIENT'},
              {'name': 'Adani Ports and Special Economic Zone Limited', 'ticker': 'ADANIPORTS'},
              {'name': 'Hindalco Industries Limited', 'ticker': 'HINDALCO'},
              {'name': 'Grasim Industries Limited', 'ticker': 'GRASIM'},
              {'name': 'Tech Mahindra Limited', 'ticker': 'TECHM'},
              {'name': 'Wipro Limited', 'ticker': 'WIPRO'},
              {'name': 'Bajaj Finserv Limited', 'ticker': 'BAJAJFINSV'},
