          with open('stocks_master.json', 'w') as f:
              json.dump(master_stocks, f, indent=2)
          print(f'Successfully updated stocks_master.json with {len(master_stocks)} stocks.')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add stocks_master.json
          git commit -m 'Auto-update cloud stock master database' || exit 0
          git push
